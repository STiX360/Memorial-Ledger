name: Validate And Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Test Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Lua Tests
        run: python tests/run_tests.py
      - name: Run Release Guard Tests
        run: python -m unittest discover -s tests -p test_release.py -v
      - name: Verify Packaging
        run: python tools/package_mod.py
      - name: Upload Import-Ready ZIP
        uses: actions/upload-artifact@v7
        with:
          name: MemorialLedger-${{ matrix.os }}
          path: dist/MemorialLedger-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
